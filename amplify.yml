version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - echo "Node version:" && node --version
        - echo "NPM version:" && npm --version
    build:
      commands:
        # NEXT_PUBLIC_API_URL must be provided in Amplify environment variables.
        # Fail fast to avoid shipping a production build that points to localhost.
        - |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "ERROR: NEXT_PUBLIC_API_URL is not set. Configure it in Amplify Console (e.g. https://api.your-domain.com/api/v1)."
            exit 1
          fi
          if echo "$NEXT_PUBLIC_API_URL" | grep -Eq 'localhost|127\.0\.0\.1'; then
            echo "ERROR: NEXT_PUBLIC_API_URL points to localhost. Use your public backend URL for production builds."
            exit 1
          fi
          export NEXT_PUBLIC_API_URL
          echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" > .env.production
          env | grep -E '^NEXT_PUBLIC_' | grep -v '^NEXT_PUBLIC_API_URL=' >> .env.production 2>/dev/null || true
          echo "Build using API URL: $NEXT_PUBLIC_API_URL"
          npm run build
        - echo "Build completed successfully"
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
